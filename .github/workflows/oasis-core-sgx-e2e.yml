name: Oasis Core SGX E2E

on:
  workflow_dispatch:
  push:
    branches:
      - oasis-sgx-e2e

permissions:
  contents: read

concurrency:
  group: oasis-core-sgx-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-sgx-e2e:
    name: Hosted non-SGX build and E2E baseline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout pinned Oasis Core source
        uses: actions/checkout@v4
        with:
          repository: oasisprotocol/oasis-core
          ref: 5d4b23dad0a07c358d94f784fdc87cb4099ffe50
          path: oasis-core
          persist-credentials: false

      - name: Pull official Oasis Core development image
        run: |
          set -euxo pipefail
          docker pull ghcr.io/oasisprotocol/oasis-core-dev:master
          test -f "$GITHUB_WORKSPACE/oasis-core/Makefile"
          ls -la "$GITHUB_WORKSPACE/oasis-core" | head -40
          mkdir -p "$RUNNER_TEMP/oasis-tmp"

      - name: Build and run non-SGX E2E in official dev container
        run: |
          set -euxo pipefail
          docker run --rm \
            --security-opt apparmor:unconfined \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE/oasis-core:/code" \
            -v "$RUNNER_TEMP/oasis-tmp:/tmp" \
            -w /code \
            -e OASIS_UNSAFE_SKIP_AVR_VERIFY=1 \
            -e OASIS_UNSAFE_SKIP_KM_POLICY=1 \
            -e OASIS_UNSAFE_ALLOW_DEBUG_ENCLAVES=1 \
            -e OASIS_BADGER_NO_JEMALLOC=1 \
            ghcr.io/oasisprotocol/oasis-core-dev:master \
            bash -lc '
              set -euxo pipefail
              cd /code
              pwd
              ls -la | head -40
              test -f Makefile
              go version
              rustup show
              command -v sgx-detect
              # The bind mount is owned by the hosted runner UID, while this
              # container runs as root. Trust the checked-out source directory
              # so Go's VCS stamping can execute git status during the build.
              git config --global --add safe.directory /code
              git -C /code status --short
              make
              unset OASIS_TEE_HARDWARE
              make test-e2e 2>&1 | tee /tmp/oasis-non-sgx-e2e.log
            '

      - name: Upload non-SGX E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-core-non-sgx-e2e-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/oasis-tmp/
            /tmp/oasis-test-runner*/

  sgx-e2e:
    # Enable only after a real SGX self-hosted runner is registered and online.
    # Set repository Actions variable OASIS_SGX_RUNNER_ENABLED=true to enable.
    if: ${{ vars.OASIS_SGX_RUNNER_ENABLED == 'true' }}
    name: Build and run Oasis Core on Intel SGX
    runs-on: [self-hosted, linux, x64, oasis-sgx]
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      OASIS_TEE_HARDWARE: intel-sgx
      OASIS_UNSAFE_SKIP_AVR_VERIFY: "1"
      OASIS_UNSAFE_ALLOW_DEBUG_ENCLAVES: "1"
      OASIS_BADGER_NO_JEMALLOC: "1"

    steps:
      - name: Checkout pinned Oasis Core source
        uses: actions/checkout@v4
        with:
          repository: oasisprotocol/oasis-core
          ref: 5d4b23dad0a07c358d94f784fdc87cb4099ffe50
          path: oasis-core
          persist-credentials: false

      - name: Set up required Go version
        uses: actions/setup-go@v5
        with:
          go-version-file: oasis-core/go/go.mod
          cache: true
          cache-dependency-path: oasis-core/go/go.sum

      - name: Select pinned Rust toolchain
        working-directory: oasis-core
        run: |
          set -euxo pipefail
          rustup show
          rustup target list --installed | grep -Fx x86_64-fortanix-unknown-sgx
          command -v clang-18
          command -v sgx-detect

      - name: Verify SGX hardware and AESM
        working-directory: oasis-core
        run: |
          set -euxo pipefail
          mkdir -p sgx-diagnostics

          if [[ -c /dev/sgx_enclave ]]; then
            echo "SGX device: /dev/sgx_enclave" | tee sgx-diagnostics/devices.txt
          elif [[ -c /dev/isgx ]]; then
            echo "SGX device: /dev/isgx (legacy driver)" | tee sgx-diagnostics/devices.txt
          else
            echo "No SGX enclave device exposed to this runner." >&2
            exit 1
          fi

          if [[ ! -S /var/run/aesmd/aesm.socket ]]; then
            echo "AESM socket missing: /var/run/aesmd/aesm.socket" >&2
            exit 1
          fi

          sgx-detect --verbose 2>&1 | tee sgx-diagnostics/sgx-detect.txt

      - name: Build Oasis Core (SGX)
        working-directory: oasis-core
        run: |
          set -euxo pipefail
          export CC_x86_64_fortanix_unknown_sgx=clang-18
          export CFLAGS_x86_64_fortanix_unknown_sgx="-isystem/usr/include/x86_64-linux-gnu"
          make

      - name: Run Oasis Core E2E suite (SGX)
        working-directory: oasis-core
        run: |
          set -euxo pipefail
          make test-e2e 2>&1 | tee sgx-diagnostics/test-e2e.log

      - name: Upload SGX and E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-core-sgx-e2e-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            oasis-core/sgx-diagnostics/
            /tmp/oasis-test-runner*/
