name: Oasis Core SGX E2E

on:
  workflow_dispatch:
  push:
    branches:
      - oasis-sgx-e2e

permissions:
  contents: read

concurrency:
  group: oasis-core-sgx-e2e-${{ github.ref }}
  # New commits replace stale queued runs, preventing an orphaned SGX job
  # from blocking the hosted baseline job for the same branch.
  cancel-in-progress: true

jobs:
  non-sgx-e2e:
    name: Run hosted non-SGX E2E baseline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      # Explicitly use Oasis Core's documented unsafe non-SGX development mode.
      # This job is a baseline only and is NOT a hardware-SGX result.
      OASIS_UNSAFE_SKIP_AVR_VERIFY: "1"
      OASIS_UNSAFE_SKIP_KM_POLICY: "1"
      OASIS_UNSAFE_ALLOW_DEBUG_ENCLAVES: "1"
      OASIS_BADGER_NO_JEMALLOC: "1"

    steps:
      - name: Checkout pinned Oasis Core source
        uses: actions/checkout@v4
        with:
          repository: oasisprotocol/oasis-core
          ref: 5d4b23dad0a07c358d94f784fdc87cb4099ffe50
          path: oasis-core
          persist-credentials: false

      - name: Install Oasis Core system prerequisites
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap gcc g++ gcc-multilib clang protobuf-compiler \
            make cmake libssl-dev libseccomp-dev pkg-config

      - name: Set up required Go version
        uses: actions/setup-go@v5
        with:
          go-version-file: oasis-core/go/go.mod
          cache: true
          cache-dependency-path: oasis-core/go/go.sum

      - name: Install Rust SGX build utilities
        working-directory: oasis-core
        run: |
          set -euxo pipefail
          rustup show
          cargo install fortanix-sgx-tools
          cargo install sgxs-tools
          rustup target list --installed | grep -Fx x86_64-fortanix-unknown-sgx

      - name: Build Oasis Core for non-SGX development
        working-directory: oasis-core
        run: |
          set -euxo pipefail
          make

      - name: Run Oasis Core E2E in non-SGX mode
        working-directory: oasis-core
        run: |
          set -euxo pipefail
          unset OASIS_TEE_HARDWARE
          make test-e2e 2>&1 | tee /tmp/oasis-non-sgx-e2e.log

      - name: Upload non-SGX E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-core-non-sgx-e2e-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            /tmp/oasis-non-sgx-e2e.log
            /tmp/oasis-test-runner*/

  sgx-e2e:
    name: Build and run Oasis Core on Intel SGX
    runs-on: [self-hosted, linux, x64, oasis-sgx]
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      OASIS_TEE_HARDWARE: intel-sgx
      OASIS_UNSAFE_SKIP_AVR_VERIFY: "1"
      OASIS_UNSAFE_ALLOW_DEBUG_ENCLAVES: "1"
      OASIS_BADGER_NO_JEMALLOC: "1"

    steps:
      - name: Checkout pinned Oasis Core source
        uses: actions/checkout@v4
        with:
          repository: oasisprotocol/oasis-core
          ref: 5d4b23dad0a07c358d94f784fdc87cb4099ffe50
          path: oasis-core
          persist-credentials: false

      - name: Set up required Go version
        uses: actions/setup-go@v5
        with:
          go-version-file: oasis-core/go/go.mod
          cache: true
          cache-dependency-path: oasis-core/go/go.sum

      - name: Select pinned Rust toolchain
        working-directory: oasis-core
        run: |
          set -euxo pipefail
          rustup show
          rustup target list --installed
          rustup target list --installed | grep -Fx x86_64-fortanix-unknown-sgx

      - name: Install SGX inspection/build tools
        working-directory: oasis-core
        run: |
          set -euxo pipefail
          if ! command -v sgx-detect >/dev/null 2>&1; then
            cargo install fortanix-sgx-tools
          fi
          if ! cargo elf2sgxs --help >/dev/null 2>&1; then
            cargo install sgxs-tools
          fi
          command -v sgx-detect
          cargo elf2sgxs --help >/dev/null

      - name: Verify SGX hardware and AESM
        working-directory: oasis-core
        run: |
          set -euxo pipefail
          mkdir -p sgx-diagnostics

          if [[ -c /dev/sgx_enclave ]]; then
            echo "SGX device: /dev/sgx_enclave" | tee sgx-diagnostics/devices.txt
          elif [[ -c /dev/isgx ]]; then
            echo "SGX device: /dev/isgx (legacy driver)" | tee sgx-diagnostics/devices.txt
          else
            echo "No SGX enclave device exposed to this runner." >&2
            exit 1
          fi

          if [[ -c /dev/sgx_provision ]]; then
            echo "SGX provisioning device: /dev/sgx_provision" | tee -a sgx-diagnostics/devices.txt
          fi

          if [[ ! -S /var/run/aesmd/aesm.socket ]]; then
            echo "AESM socket missing: /var/run/aesmd/aesm.socket" >&2
            exit 1
          fi

          sgx-detect --verbose 2>&1 | tee sgx-diagnostics/sgx-detect.txt

          {
            echo "kernel: $(uname -sr)"
            echo "architecture: $(uname -m)"
            echo "Go: $(go version)"
            echo "Rust: $(rustc --version)"
            echo "Cargo: $(cargo --version)"
            echo "OASIS_TEE_HARDWARE: ${OASIS_TEE_HARDWARE}"
          } | tee sgx-diagnostics/toolchain.txt

      - name: Build Oasis Core (SGX)
        working-directory: oasis-core
        run: |
          set -euxo pipefail
          make

      - name: Run Oasis Core E2E suite (SGX)
        working-directory: oasis-core
        run: |
          set -euxo pipefail
          make test-e2e 2>&1 | tee sgx-diagnostics/test-e2e.log

      - name: Upload SGX and E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-core-sgx-e2e-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            oasis-core/sgx-diagnostics/
            /tmp/oasis-test-runner*/
