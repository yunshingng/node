name: Oasis ROFL expired top-up runtime E2E

on:
  push:
    branches:
      - repro/oasis-rofl-expired-topup-e2e-20261115
    paths:
      - '.github/scripts/patch-oasis-rofl-e2e.mjs'
      - '.github/workflows/oasis-rofl-expired-topup-e2e.yml'
      - 'rofl-scheduler/tests/host_protocol_e2e.rs'

permissions:
  contents: write

jobs:
  rofl-market-runtime-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout harness repository
        uses: actions/checkout@v4

      - name: Checkout affected Oasis SDK commit
        uses: actions/checkout@v4
        with:
          repository: oasisprotocol/oasis-sdk
          ref: beae84eac81e67a5134825eb192496c5af079cae
          path: oasis-sdk

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-16
          components: rustfmt

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Inject isolated runtime regression test
        run: node .github/scripts/patch-oasis-rofl-e2e.mjs oasis-sdk/runtime-sdk/modules/rofl-market/src/test.rs

      - name: Check formatting
        working-directory: oasis-sdk
        run: |
          cargo fmt --manifest-path runtime-sdk/modules/rofl-market/Cargo.toml
          cargo fmt --manifest-path rofl-scheduler/Cargo.toml

      - name: Run Oasis Rust runtime transaction E2E
        working-directory: oasis-sdk
        env:
          CARGO_TERM_COLOR: always
        run: cargo test --manifest-path runtime-sdk/modules/rofl-market/Cargo.toml test_expired_topup_charges_full_fee_and_claims_expired_gap -- --nocapture

      - name: Run Scheduler manager and mock-host lifecycle tests
        working-directory: oasis-sdk
        env:
          CARGO_TERM_COLOR: always
          ROFL_APP_ID: rofl1qrev5wq76npkmcv5wxkdxxcu4dhmu704yyl30h43
        run: |
          cargo test --manifest-path rofl-scheduler/Cargo.toml 'manager::test::' -- --nocapture

      - name: Run Scheduler process over real Runtime Host Protocol socket
        working-directory: oasis-sdk
        env:
          CARGO_TERM_COLOR: always
          ROFL_APP_ID: rofl1qrev5wq76npkmcv5wxkdxxcu4dhmu704yyl30h43
        run: cargo test --manifest-path rofl-scheduler/Cargo.toml --test host_protocol_e2e -- --nocapture

      - name: Record result for verification
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_COMMIT: beae84eac81e67a5134825eb192496c5af079cae
        run: |
          mkdir -p .github/test-results
          {
            echo "job_status=${JOB_STATUS}"
            echo "workflow_run=${RUN_URL}"
            echo "target_commit=${TARGET_COMMIT}"
            echo "runtime_test=test_expired_topup_charges_full_fee_and_claims_expired_gap"
            echo "runtime_expired_gap_seconds=600"
            echo "runtime_provider_fee_for_gap_delta=2"
            echo "scheduler_removal_min_delay_seconds=1350"
            echo "scheduler_timing_test=test_ten_minute_expired_topup_is_before_minimum_removal_delay"
            echo "scheduler_tests=manager::test:: suite passed; see CI log for exact count"
            echo "scheduler_host_protocol_e2e=test_scheduler_process_uses_real_rhp_host_rpc_for_expiry_cleanup (simulated Host backend)"
          } | tee .github/test-results/oasis-rofl-expired-topup-e2e.txt
          cat .github/test-results/oasis-rofl-expired-topup-e2e.txt >> "$GITHUB_STEP_SUMMARY"
