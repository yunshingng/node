name: Oasis ROFL expired top-up runtime E2E

on:
  push:
    branches:
      - repro/oasis-rofl-expired-topup-e2e-20261115
    paths:
      - '.github/scripts/patch-oasis-rofl-e2e.mjs'
      - '.github/workflows/oasis-rofl-expired-topup-e2e.yml'

permissions:
  contents: write

jobs:
  rofl-market-runtime-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout harness repository
        uses: actions/checkout@v4

      - name: Checkout affected Oasis SDK commit
        uses: actions/checkout@v4
        with:
          repository: oasisprotocol/oasis-sdk
          ref: beae84eac81e67a5134825eb192496c5af079cae
          path: oasis-sdk

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-16
          components: rustfmt

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Inject isolated runtime regression test
        run: node .github/scripts/patch-oasis-rofl-e2e.mjs oasis-sdk/runtime-sdk/modules/rofl-market/src/test.rs

      - name: Check formatting
        working-directory: oasis-sdk
        run: cargo fmt --manifest-path runtime-sdk/modules/rofl-market/Cargo.toml

      - name: Run Oasis Rust runtime transaction E2E
        working-directory: oasis-sdk
        env:
          CARGO_TERM_COLOR: always
        run: cargo test --manifest-path runtime-sdk/modules/rofl-market/Cargo.toml test_expired_topup_charges_full_fee_and_stale_remove_can_delete_renewed_instance -- --nocapture

      - name: Record result for verification
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_COMMIT: beae84eac81e67a5134825eb192496c5af079cae
        run: |
          mkdir -p .github/test-results
          {
            echo "job_status=${JOB_STATUS}"
            echo "workflow_run=${RUN_URL}"
            echo "target_commit=${TARGET_COMMIT}"
            echo "test=test_expired_topup_charges_full_fee_and_stale_remove_can_delete_renewed_instance"
          } > .github/test-results/oasis-rofl-expired-topup-e2e.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/test-results/oasis-rofl-expired-topup-e2e.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Oasis ROFL runtime E2E result"
            git push
          fi
