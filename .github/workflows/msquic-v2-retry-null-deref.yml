name: MsQuic QUICv2 Retry off-path Internet spoof validation

on:
  push:
    branches:
      - security-research/msquic-v2-retry-e2e
    paths:
      - "security-research/msquic-v2-retry-null-deref/**"
      - ".github/workflows/msquic-v2-retry-null-deref.yml"

permissions:
  contents: write

env:
  COORD_BRANCH: security-research/msquic-offpath-nettest-coordination

jobs:
  internet-server:
    name: Public QUIC server (runner A)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated PoC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            security-research/msquic-v2-retry-null-deref
          sparse-checkout-cone-mode: true

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100

      - name: Build exact Release MsQuic and E2E app
        run: bash security-research/msquic-v2-retry-null-deref/build-msquic-e2e.sh

      - name: Publish public endpoint and run QUIC server
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash security-research/msquic-v2-retry-null-deref/internet-offpath-server.sh

      - name: Upload server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offpath-internet-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: msquic-internet-results/server/
          if-no-files-found: warn

  internet-client:
    name: QUIC client behind independent Internet edge (runner B)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated PoC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            security-research/msquic-v2-retry-null-deref
          sparse-checkout-cone-mode: true

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100

      - name: Build exact Release MsQuic and E2E app
        run: bash security-research/msquic-v2-retry-null-deref/build-msquic-e2e.sh

      - name: Run QUIC client and capture incoming spoof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash security-research/msquic-v2-retry-null-deref/internet-offpath-client.sh

      - name: Upload client evidence and core
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offpath-internet-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: msquic-internet-results/client/
          if-no-files-found: warn

  internet-attacker:
    name: Independent off-path source-spoof sender (runner C)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated PoC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            security-research/msquic-v2-retry-null-deref
          sparse-checkout-cone-mode: true

      - name: Install raw-packet capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 tcpdump curl jq

      - name: Send exactly one spoofed UDP datagram from separate Internet runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash security-research/msquic-v2-retry-null-deref/internet-offpath-attacker.sh

      - name: Upload attacker packet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offpath-internet-attacker-${{ github.run_id }}-${{ github.run_attempt }}
          path: msquic-internet-results/attacker/
          if-no-files-found: warn
