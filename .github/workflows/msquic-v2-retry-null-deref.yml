name: MsQuic v2 Retry compatible-version null-deref E2E

on:
  push:
    branches:
      - security-research/msquic-v2-retry-e2e
    paths:
      - "security-research/msquic-v2-retry-null-deref/**"
      - ".github/workflows/msquic-v2-retry-null-deref.yml"

permissions:
  contents: read

jobs:
  release-e2e:
    name: .NET 10.0.15 Release + MsQuic main @ 3e870278
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout isolated PoC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            security-research/msquic-v2-retry-null-deref
          sparse-checkout-cone-mode: true

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100

      - name: Install build and crash-analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl zlib1g-dev libnuma-dev openssl python3 gdb

      - name: Install exact .NET 10.0.15 runtime
        shell: bash
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --runtime dotnet --version 10.0.15 --install-dir "$DOTNET_ROOT"
          dotnet --list-runtimes
          dotnet --list-runtimes | grep -F "Microsoft.NETCore.App 10.0.15"

      - name: Build official MsQuic main source in Release
        shell: bash
        run: |
          git clone --depth 1 --branch main --recurse-submodules https://github.com/microsoft/msquic.git "$RUNNER_TEMP/msquic"
          test "$(git -C "$RUNNER_TEMP/msquic" rev-parse HEAD)" = "3e870278781a6d34524fc55c6bae220e182d6124"
          cmake -S "$RUNNER_TEMP/msquic" -B "$RUNNER_TEMP/msquic/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQUIC_BUILD_SHARED=ON \
            -DQUIC_BUILD_TOOLS=OFF \
            -DQUIC_BUILD_TEST=OFF \
            -DQUIC_ENABLE_LOGGING=OFF
          cmake --build "$RUNNER_TEMP/msquic/build" --parallel 2
          echo "MSQUIC_LIB_DIR=$RUNNER_TEMP/msquic/build/bin/Release" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/msquic/build/bin/Release"/libmsquic.so*

      - name: Build isolated System.Net.Quic E2E app
        working-directory: security-research/msquic-v2-retry-null-deref
        env:
          DOTNET_ROLL_FORWARD: LatestPatch
          MSQUIC_LIB_DIR: ${{ runner.temp }}/msquic/build/bin/Release
          LD_LIBRARY_PATH: ${{ runner.temp }}/msquic/build/bin/Release
        run: |
          dotnet build MsQuicRetryE2E.csproj --configuration Release
          dotnet --list-runtimes
          dotnet bin/Release/net10.0/MsQuicRetryE2E.dll --check-runtime

      - name: Run secure Release attack, controls, and collect crash backtraces
        shell: bash
        env:
          DOTNET_ROLL_FORWARD: LatestPatch
        run: |
          chmod +x security-research/msquic-v2-retry-null-deref/run-e2e.sh
          security-research/msquic-v2-retry-null-deref/run-e2e.sh

      - name: Upload E2E logs and crash backtraces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msquic-v2-retry-e2e-logs-main-3e870278
          path: msquic-e2e-results/
          if-no-files-found: warn
